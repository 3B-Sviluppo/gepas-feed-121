name: Aggiorna Feed Scioperi GEPAS

on:
  schedule:
    - cron: '0 */6 * * *'   # ogni 6 ore (0:00, 6:00, 12:00, 18:00 UTC)
  workflow_dispatch:          # permette anche l'esecuzione manuale dal pannello GitHub

jobs:
  genera-xml:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl

      - name: Genera scioperi.xml
        run: php generate.php

      - name: Commit e push se ci sono modifiche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scioperi.xml
          git diff --staged --quiet || git commit -m "Aggiornamento feed scioperi $(date +'%Y-%m-%d %H:%M UTC')"
          git push
